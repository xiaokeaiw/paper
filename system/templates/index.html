<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于曲线相似性的分布式集群异常检测系统</title>
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-title">
            <h1>基于曲线相似性的分布式集群异常检测系统</h1>
            <span class="header-subtitle">Curve Similarity-based Anomaly Detection System</span>
        </div>
        <div class="header-actions">
            <span class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span id="statusText">就绪</span>
            </span>
        </div>
    </header>

    <div class="main-container">
        <!-- 左侧面板：数据接入与算法配置 -->
        <aside class="sidebar">
            <!-- 数据接入区域 -->
            <div class="panel">
                <h3 class="panel-title">数据接入</h3>
                <div class="tab-group">
                    <button class="tab-btn active" data-tab="upload">文件上传</button>
                    <button class="tab-btn" data-tab="api">API接入</button>
                    <button class="tab-btn" data-tab="demo">演示数据</button>
                </div>

                <!-- 文件上传 -->
                <div class="tab-content active" id="tab-upload">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📂</div>
                        <p>拖拽文件到此处，或<span class="upload-link">点击选择</span></p>
                        <p class="upload-hint">支持 CSV、JSON 格式，最大 50MB</p>
                        <input type="file" id="fileInput" accept=".csv,.json" hidden>
                    </div>
                    <div class="upload-info" id="uploadInfo" style="display:none;">
                        <div class="info-row">
                            <span class="info-label">文件名:</span>
                            <span id="fileName"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">指标数:</span>
                            <span id="metricCount"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">节点数:</span>
                            <span id="nodeCount"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">时间步:</span>
                            <span id="timestepCount"></span>
                        </div>
                    </div>
                </div>

                <!-- API接入 -->
                <div class="tab-content" id="tab-api">
                    <div class="form-group">
                        <label>Prometheus 地址</label>
                        <input type="text" id="promUrl" placeholder="http://prometheus:9090" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>PromQL 查询</label>
                        <input type="text" id="promQuery" placeholder="node_cpu_seconds_total" class="form-input">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>开始时间</label>
                            <input type="datetime-local" id="promStart" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>结束时间</label>
                            <input type="datetime-local" id="promEnd" class="form-input">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>采样间隔</label>
                        <input type="text" id="promStep" value="60s" class="form-input">
                    </div>
                    <button class="btn btn-primary" onclick="loadFromPrometheus()">连接并加载</button>
                </div>

                <!-- 演示数据 -->
                <div class="tab-content" id="tab-demo">
                    <p class="demo-desc">加载预生成的模拟集群监控数据，包含15个节点、500个时间步，其中2个节点注入了异常行为。</p>
                    <button class="btn btn-primary" onclick="loadDemoData()">加载演示数据</button>
                </div>
            </div>

            <!-- 算法配置区域 -->
            <div class="panel">
                <h3 class="panel-title">算法配置</h3>
                <div class="form-group">
                    <label>检测场景</label>
                    <select id="scenarioSelect" class="form-input" onchange="onScenarioChange()">
                        <option value="auto">自动判断</option>
                        <option value="single">单指标多节点（CSAD-AT）</option>
                        <option value="multi">多指标多节点（双视角融合）</option>
                    </select>
                </div>

                <!-- 单指标参数 -->
                <div id="singleParams">
                    <div class="form-group">
                        <label>滑动窗口大小</label>
                        <input type="number" id="windowSize" value="60" min="10" max="500" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>检测方法</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" value="euclidean" checked> 欧氏距离
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="autoencoder" checked> 自编码器
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="dbscan" checked> DBSCAN
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>DBSCAN邻域半径 (eps)</label>
                        <input type="number" id="dbscanEps" value="0.5" step="0.1" min="0.1" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>I-SPOT目标误报率 (q)</label>
                        <input type="number" id="ispotQ" value="0.001" step="0.001" min="0.0001" class="form-input">
                    </div>
                </div>

                <!-- 多指标参数 -->
                <div id="multiParams" style="display:none;">
                    <div class="form-group">
                        <label>数值视角权重</label>
                        <input type="range" id="wNum" min="0" max="1" step="0.1" value="0.5"
                               oninput="document.getElementById('wNumVal').textContent=this.value">
                        <span id="wNumVal">0.5</span>
                    </div>
                    <div class="form-group">
                        <label>形状视角权重</label>
                        <input type="range" id="wShape" min="0" max="1" step="0.1" value="0.5"
                               oninput="document.getElementById('wShapeVal').textContent=this.value">
                        <span id="wShapeVal">0.5</span>
                    </div>
                    <div class="form-group">
                        <label>SAX字母表大小</label>
                        <input type="number" id="alphabetSize" value="7" min="3" max="20" class="form-input">
                    </div>
                </div>

                <button class="btn btn-accent" onclick="runDetection()" id="detectBtn" disabled>
                    开始检测
                </button>
            </div>
        </aside>

        <!-- 中央内容区域 -->
        <main class="content">
            <!-- 多节点曲线对比图 -->
            <div class="chart-panel">
                <h3 class="chart-title">多节点曲线对比图</h3>
                <div id="curveChart" class="chart-container"></div>
            </div>

            <!-- 异常分数排名 -->
            <div class="chart-row">
                <div class="chart-panel half">
                    <h3 class="chart-title">节点异常分数排名</h3>
                    <div id="scoreChart" class="chart-container-sm"></div>
                </div>
                <div class="chart-panel half">
                    <h3 class="chart-title">异常检测时间线</h3>
                    <div id="timelineChart" class="chart-container-sm"></div>
                </div>
            </div>

            <!-- 检测结果摘要 -->
            <div class="chart-panel">
                <h3 class="chart-title">检测结果摘要</h3>
                <div id="resultSummary" class="result-summary">
                    <p class="placeholder-text">请先加载数据并执行检测</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
