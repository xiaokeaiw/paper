<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSAD-AT 算法架构示意图</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        body {
            background-color: #ffffff;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: #1e293b;
        }

        .canvas {
            width: 1000px;
            height: 500px;
            background: #ffffff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 模块容器 */
        .module-container {
            border: 1.5px solid #94a3b8;
            border-radius: 8px;
            padding: 30px 15px 15px 15px;
            position: relative;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .module-title {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #475569;
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 节点块 */
        .node {
            width: 140px;
            background: #ffffff;
            border: 1.2px solid #64748b;
            border-radius: 4px;
            padding: 8px 6px;
            text-align: center;
            font-size: 15.5px;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* 颜色方案 */
        .bg-view { background-color: #f0f9ff; border-color: #0ea5e9; }      /* 多视角：天蓝 */
        .bg-agg { background-color: #f5f3ff; border-color: #8b5cf6; }       /* 聚合：紫色 */
        .bg-spot { background-color: #fff7ed; border-color: #f97316; }      /* I-SPOT：橙色 */
        .bg-input { background-color: #f8fafc; border-style: dashed; }      /* 输入 */

        /* 连接件 */
        .connector {
            width: 20px;
            height: 2px;
            background: #cbd5e1;
            position: relative;
        }
        .connector::after {
            content: '';
            position: absolute;
            right: -2px;
            top: -4px;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 8px solid #cbd5e1;
        }

        /* 聚合线条 */
        .brace-right {
            width: 20px;
            height: 180px;
            border-right: 2px solid #cbd5e1;
            border-top: 2px solid #cbd5e1;
            border-bottom: 2px solid #cbd5e1;
            border-radius: 0 6px 6px 0;
            margin-left: 5px;
        }

        .math {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="canvas">
    <div class="flex items-center">

        <!-- 数据输入 -->
        <div class="flex flex-col items-center gap-2">
            <div class="node bg-input">
                <span class="font-bold">多节点监控数据</span><br>
                <span class="math">X = {x<sup>1</sup>, x<sup>2</sup>, ...}</span>
            </div>
            <div class="text-[14px] text-slate-400">滑动时间窗口</div>
        </div>

        <div class="connector ml-2"></div>

        <!-- 模块 1：多视角相似性评分 -->
        <div class="module-container border-sky-400 ml-2">
            <div class="module-title" style="background: #0ea5e9;">模块 I：多视角分数</div>
            <div class="flex flex-col gap-3">
                <div class="node bg-view">数值视角<br><span class="text-[14px] text-sky-700">(欧氏距离度量)</span></div>
                <div class="node bg-view">嵌入视角<br><span class="text-[14px] text-sky-700">(自编码器空间)</span></div>
                <div class="node bg-view">密度视角<br><span class="text-[14px] text-sky-700">(局部密度特征)</span></div>
            </div>
        </div>

        <!-- 聚合分支 -->
        <div class="brace-right"></div>

        <div class="connector"></div>

        <!-- 模块 2：归一化与聚合 -->
        <div class="module-container border-violet-400">
            <div class="module-title" style="background: #8b5cf6;">模块 II：分数归一与聚合</div>
            <div class="flex flex-col items-center gap-4">
                <div class="node bg-agg">
                    <span class="font-bold">Max-Min 归一化</span><br>
                    <span class="text-[14px]">统一各视角分数量纲</span>
                </div>
                <div class="h-4 w-[1px] bg-violet-300"></div>
                <div class="node bg-agg">
                    <span class="font-bold">加权聚合</span><br>
                    <span class="math text-[14px]">S<sub>total</sub> = Σ w<sub>i</sub> · s<sub>i</sub></span>
                </div>
            </div>
        </div>

        <div class="connector"></div>

        <!-- 模块 3：I-SPOT -->
        <div class="module-container border-orange-400" style="width: 220px;">
            <div class="module-title" style="background: #f97316;">模块 III：I-SPOT 自适应检测</div>
            <div class="flex flex-col items-center gap-4">
                <div class="node bg-spot w-full">
                    <span class="font-bold">全局序列交织</span><br>
                    <span class="text-[14px]">多节点分数按时序排列</span>
                </div>
                <div class="h-4 w-[1px] bg-orange-300"></div>
                <div class="node bg-spot w-full">
                    <span class="font-bold">I-SPOT 动态异常检测</span><br>
                    <span class="text-[14px]">基于极值理论动态阈值</span>
                </div>
            </div>
        </div>

        <div class="connector"></div>

        <!-- 输出 -->
        <div class="flex flex-col items-center ml-1">
            <div class="node bg-slate-800 text-white font-bold border-none" style="width: auto; padding: 8px 18px; border-radius: 20px; white-space: nowrap;">
                异常检测结果
            </div>
        </div>

    </div>


</div>

</body>
</html>
